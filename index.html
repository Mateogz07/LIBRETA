/* ============ Paleta: los colores de los billetes colombianos ============ */
:root{
  --paper:#F5F3F8; --surface:#FFFFFF; --ink:#1C1430; --muted:#6B6480; --line:#E8E3F0;
  --brand:#4E2A84;                         /* billete de 50 mil */
  --in:#138556;                            /* 100 mil */
  --out:#D0453B;                           /* 10 mil */
  --debt:#D9731A;                          /* 20 mil */
  --save:#2A6FC9;                          /* 2 mil */
  --pocket:#0E918C; --fixed:#C99212; --free:#C9B8EE;
  --accent:var(--brand);
  --soft:color-mix(in srgb,var(--brand) 8%,var(--surface));
  --ledger:var(--brand); --ledger-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(28,20,48,.04),0 8px 24px -14px rgba(28,20,48,.18);
  --edge:transparent;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-color="verde"]{--brand:#0E6A4A;--free:#AEDCC6}
:root[data-color="azul"]{--brand:#1C4E9B;--free:#B4CBEE}
:root[data-color="grafito"]{--brand:#2B2F38;--free:#C6CAD3}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#100C19; --surface:#1A1526; --ink:#F0ECF8; --muted:#A49DB8; --line:#2C2540;
    --in:#45C98C; --out:#FF7A6E; --debt:#F5A25A; --save:#72A9F2; --pocket:#3DC7C0; --fixed:#E9C04C; --free:#5A4B80;
    --accent:color-mix(in srgb,var(--brand) 42%,#fff);
    --soft:color-mix(in srgb,var(--brand) 22%,var(--surface));
    --shadow:none; --edge:var(--line); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#100C19; --surface:#1A1526; --ink:#F0ECF8; --muted:#A49DB8; --line:#2C2540;
  --in:#45C98C; --out:#FF7A6E; --debt:#F5A25A; --save:#72A9F2; --pocket:#3DC7C0; --fixed:#E9C04C; --free:#5A4B80;
  --accent:color-mix(in srgb,var(--brand) 42%,#fff);
  --soft:color-mix(in srgb,var(--brand) 22%,var(--surface));
  --shadow:none; --edge:var(--line); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 150px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:12px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.month h1{font-family:var(--display);font-size:1.02rem;margin:0;min-width:8.8em;text-align:center;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn svg.i{width:20px;height:20px}
.hright{display:flex;align-items:center;gap:4px}
.sync{font-size:.76rem;color:var(--muted);display:none;align-items:center;gap:6px}
.sync.ok{display:flex}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fixed);display:inline-block}
.sync.ok i{background:var(--in)}

/* El billete: lo único llamativo de la app */
.billete{position:relative;isolation:isolate;overflow:hidden;background:var(--brand);color:#fff;border-radius:var(--r-xl);padding:20px 20px 16px;margin:6px 0 4px;

.billete::after{content:"";position:absolute;inset:7px;border-radius:22px;border:1px solid rgba(255,255,255,.16);pointer-events:none}
.billete .lbl{margin:0;font-weight:600;font-size:.92rem;color:rgba(255,255,255,.8)}
.billete .big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11.5vw,3.5rem);letter-spacing:-.025em;line-height:1.02;margin:6px 0 6px}
.billete .big.neg{color:#FFD2CC}
.billete .sub{margin:0 0 16px;font-size:.93rem;color:rgba(255,255,255,.86)}
.billete .sub b{color:#fff}
.billete .bar{background:rgba(255,255,255,.18)}
.billete .more{color:#fff;opacity:.9}
.hero{padding:8px 2px 4px}
.hero .lbl{color:var(--muted);font-weight:600;margin:0}
.hero .big{font-family:var(--display);font-size:clamp(2.2rem,9vw,2.8rem);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:4px 0 2px}
.hero .big.neg{color:var(--out)}
.hero .sub{color:var(--muted);margin:0 0 8px;font-size:.93rem}
.hero.sm .big{font-size:2.3rem}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.bar span{display:block;height:100%;min-width:0;transition:flex-grow .5s ease}
.barbtn{border:0;background:none;padding:0;width:100%;display:grid;gap:10px;text-align:left;color:inherit}
.barbtn .more{justify-self:start}
.legend{margin:14px 0 6px;display:grid}
.legend .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.legend .row:last-child{border-bottom:0}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend .n{flex:1}
.legend .v{font-weight:700}

/* Secciones y listas */
h2{font-family:var(--display);font-size:1.14rem;margin:28px 0 10px;font-weight:700;letter-spacing:-.015em}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:28px 2px 10px}
.sec h2{margin:0}
.more{border:0;background:none;color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 0}
.hint{color:var(--muted);font-size:.9rem;margin:-4px 0 12px}
.sub2{color:var(--muted);font-size:.87rem;margin:-6px 2px 10px}
.h4{font-family:var(--display);font-size:1rem;margin:20px 2px 8px;color:var(--ink);font-weight:700}
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:transparent;border:0;text-align:left;position:relative;color:inherit}
.item+.item::before,.tip+.tip::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
button.item:active{background:var(--soft)}
.ico{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:1.15rem;flex:none}
.grow{flex:1;min-width:0}
.grow>.t,.grow>.s{display:block}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:.84rem}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.save{color:var(--save)} .amt.debt{color:var(--debt)}
.chev{color:var(--muted);font-size:1.35rem;line-height:1;opacity:.5;margin-left:-2px}
.mini{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.mini span{display:block;height:100%;border-radius:3px}
.day{font-size:.84rem;color:var(--muted);font-weight:700;margin:20px 4px 8px;text-transform:capitalize}
.empty{padding:24px 18px;text-align:center;color:var(--muted)}
.empty.sm{padding:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.prog span{display:block;height:100%;border-radius:5px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;gap:8px;flex-wrap:wrap}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r-lg);padding:14px 4px;margin-top:10px;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.stat3 div{text-align:center;display:grid;gap:2px;padding:0 4px;min-width:0}
.stat3 div+div{border-left:1px solid var(--line)}
.stat3 small{color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat3 b{font-family:var(--display);font-size:1.06rem;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.pk{flex:none;width:146px;border:0;background:var(--surface);border-radius:var(--r-lg);padding:13px 14px;text-align:left;display:grid;gap:1px;color:inherit;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.pk-i{font-size:1.3rem;margin-bottom:6px}
.pk-n{font-size:.83rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-v{font-family:var(--display);font-weight:700;font-size:1.08rem}.pk-v.neg{color:var(--out)}
.tipcard{display:flex;gap:12px;background:var(--surface);border-radius:var(--r-lg);padding:14px;border:0;text-align:left;width:100%;align-items:flex-start;color:inherit;box-shadow:var(--shadow),0 0 0 1px var(--edge)}
.tipcard b,.tip b{display:block;margin-bottom:2px}
.tipcard .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.88rem}
.tip{display:flex;gap:12px;padding:13px 14px;align-items:flex-start;position:relative}
.tip .ico,.tipcard .ico{width:36px;height:36px;font-size:1rem}
.tip span.s{font-size:.88rem;display:block}
.alerta .ico{background:color-mix(in srgb,var(--out) 16%,transparent)}
.atencion .ico{background:color-mix(in srgb,var(--fixed) 20%,transparent)}
.idea .ico{background:color-mix(in srgb,var(--save) 15%,transparent)}
.qchip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in);white-space:nowrap}
.qchip.neg{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.tag{font-size:.76rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.paid{color:var(--in);background:color-mix(in srgb,var(--in) 13%,transparent)}
.tag.due{color:var(--fixed)}
.banner{background:var(--soft);color:var(--ink);border-radius:var(--r-lg);padding:16px;margin:8px 0 4px}
.banner p{margin:4px 0 12px;color:var(--muted)}
.banner .btn{background:var(--brand);color:#fff}

/* Controles */
.pill{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pill.on{background:var(--brand);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--brand);color:#fff}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--out);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--out) 50%,transparent)}
.btn.sm{padding:9px 13px;font-size:.88rem;border-radius:12px}
.btn.full{width:100%}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;font-size:.9rem}

/* Barra inferior y botón + */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;padding:8px 2px 9px;display:grid;justify-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
.nav .ic{width:54px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.nav button.on{color:var(--ink)}
.nav button.on .ic{background:var(--soft);color:var(--accent)}
.fab{position:fixed;z-index:11;right:max(18px,calc(50% - 262px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:60px;height:60px;border-radius:20px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;
  box-shadow:0 12px 26px -10px color-mix(in srgb,var(--brand) 75%,transparent)}
.fab svg.i{width:28px;height:28px;stroke-width:2.2}

/* Hojas */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(16,10,28,.5);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;
  padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar span,.nav .ic{transition:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--display);margin:0 0 14px;font-size:1.35rem;font-weight:700;letter-spacing:-.015em}
.sheet .list,.sheet .card,.sheet .stat3{background:var(--paper);box-shadow:none}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.86rem;font-weight:600;color:var(--muted)}
.field input,.field select,.rapido input,.pregunta input{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;width:100%}
.field input:focus,.field select:focus,.rapido input:focus,.pregunta input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.money{font-family:var(--display);font-size:2.3rem!important;font-weight:700;letter-spacing:-.02em;padding:10px 14px!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(28,20,48,.14)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{border:0;background:var(--paper);border-radius:14px;padding:9px 4px;display:grid;justify-items:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.catgrid button .e{font-size:1.3rem}
.catgrid button.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.calc{background:var(--paper);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:.9rem;box-shadow:inset 0 0 0 1px var(--line)}
.calc .kv{padding:3px 0}
.calc .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:800;color:var(--ink);display:flex;justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:var(--muted)}
.kv b{color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(152px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:14px;font-weight:600;font-size:.9rem;display:none;max-width:calc(100% - 32px)}
.toast.show{display:block}
.toast button{margin-left:12px;border:0;background:none;color:var(--free);font-weight:800;text-decoration:underline}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.w{display:grid;justify-items:center;gap:3px;font-size:.72rem;color:var(--muted);padding:6px 2px;border-radius:12px}
.w.cur{background:var(--soft);color:var(--ink);font-weight:700}
.wb{width:100%;max-width:34px;height:48px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.wb span{position:absolute;left:0;right:0;bottom:0;background:var(--pocket);border-radius:9px 9px 0 0}
.wb span.over{background:var(--out)}
.sug{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.rapido{display:flex;gap:8px;margin-bottom:6px}
.rapido input{flex:1;min-width:0}
.prev{font-size:.85rem;color:var(--muted);margin:0 2px 12px;min-height:1.2em}
.fav{border:0;background:var(--paper);border-radius:14px;padding:9px 12px;text-align:left;flex:none;display:grid;font-size:.82rem;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.fav b{font-size:.9rem}
.estado{font-size:.82rem;color:var(--muted);margin:10px 2px 0;display:flex;gap:6px;align-items:center}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--in);display:inline-block}
.estado.off i{background:var(--fixed)}
.pregunta{display:flex;gap:8px;margin-top:12px}
.pregunta input{flex:1;min-width:0}
.ai{white-space:pre-wrap;font-size:.94rem;line-height:1.55}
.fuente{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:700;color:var(--muted)}
/* Apariencia */
.temas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tema{border:0;background:transparent;display:grid;justify-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);padding:4px 0}
.tema span{width:44px;height:44px;border-radius:15px;box-shadow:0 0 0 1px var(--line)}
.tema.on{color:var(--ink)}
.tema.on span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month">
      <button class="iconbtn" id="prev" aria-label="Mes anterior"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="mesLbl"></h1>
      <button class="iconbtn" id="next" aria-label="Mes siguiente"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="hright"><div class="sync" id="sync"><i></i><span>Este dispositivo</span></div>
      <button class="iconbtn" id="cfg" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Registrar movimiento"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" aria-label="Secciones"><div class="in" id="nav"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("es-CO");
const num = s => parseInt(String(s).replace(/\D/g, "") || "0", 10);
const pad = n => String(n).padStart(2, "0");
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = f => f.slice(0, 7);
const ymShift = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const mesNombre = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("es-CO", { month: "long", year: "numeric" }); };
const diaNombre = f => { const [y, m, d] = f.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "short" }); };
const mesesEntre = (desdeYm, hastaYm) => { const [a, b] = desdeYm.split("-").map(Number); const [c, d] = hastaYm.split("-").map(Number); return (c - a) * 12 + (d - b); };
const clone = o => JSON.parse(JSON.stringify(o));
const ultimoDia = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const emv = ea => (Math.pow(1 + ea/100, 1/12) - 1) * 100;
const eaDeMv = mv => (Math.pow(1 + mv/100, 12) - 1) * 100;
const fmtPct = x => (Math.round(x*100)/100).toLocaleString("es-CO", { maximumFractionDigits: 2 }) + "%";

/* ============ Datos por defecto ============ */
function configInicial() {
  return {
    cuentas: [
      { id: uid(), nombre: "Efectivo", icono: "💵", saldoInicial: 0 },
      { id: uid(), nombre: "Nequi", icono: "📱", saldoInicial: 0 },
      { id: uid(), nombre: "Bancolombia", icono: "🏦", saldoInicial: 0, gmf: true },
      { id: uid(), nombre: "Daviplata", icono: "📲", saldoInicial: 0 },
    ],
    categorias: [
      ["Mercado","🛒","gasto"],["Transporte","🚌","gasto"],["Comida fuera","🍔","gasto"],["Servicios","💡","gasto"],
      ["Arriendo","🏠","gasto"],["Salud","💊","gasto"],["Salidas","🎉","gasto"],["Ropa","👕","gasto"],
      ["Educación","📚","gasto"],["Tecnología","🔌","gasto"],["Regalos","🎁","gasto"],["Otros","📦","gasto"],
      ["Salario","💼","ingreso"],["Freelance","🧰","ingreso"],["Otros ingresos","➕","ingreso"],
    ].map(([nombre, icono, tipo]) => ({ id: uid(), nombre, icono, tipo })),
    recurrentes: [], deudas: [], metas: [], tarjetas: [], bolsillos: [], perfil: null,
    legal: { anio: 2026, smmlv: 1750905, aux: 249095 }, updatedAt: Date.now(),
  };
}

/* ============ Estado ============ */
const LS = "libreta-finanzas-v1";
let data = { config: configInicial(), meses: {} };
const ui = { tab: "inicio", mes: ymOf(hoy()), filtro: "todos" };
try { const raw = localStorage.getItem(LS); if (raw) { const p = JSON.parse(raw); if (p && p.config) data = p; } } catch (e) {}
function normalizar() {
  const c = data.config;
  c.legal ||= { anio: 2026, smmlv: 1750905, aux: 249095 };
  if (c.perfil === undefined) c.perfil = null;
  c.recurrentes ||= []; c.deudas ||= []; c.tarjetas ||= []; c.bolsillos ||= []; c.favoritos ||= []; c.personas ||= []; c.metas ||= []; c.cuentas ||= []; c.categorias ||= [];
}
normalizar();

const movsMes = ym => (data.meses[ym]?.movs || []);
const todos = () => Object.values(data.meses).flatMap(m => m.movs || []);
const cat = id => data.config.categorias.find(c => c.id === id);
const cuenta = id => data.config.cuentas.find(c => c.id === id);
const tarjeta = id => data.config.tarjetas.find(t => t.id === id);
const persona = id => data.config.personas.find(p => p.id === id);
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const HAY_CLAUDE = !!(window.claude && window.claude.use);
const CAP = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null;

/* ============ Persistencia: tu cuenta (db) + copia local ============ */
let col = null, remotoListo = false;
const colas = {};
function guardarLocal() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} }
function remoto(docId, body) {
  if (!col) return;
  const cuerpo = clone(body);
  colas[docId] = (colas[docId] || Promise.resolve())
    .then(() => col.doc(docId).set(cuerpo))
    .catch(e => { if (e && e.code === "invalid_argument") { col = null; estadoSync(false); return; } if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 800 + Math.random()*800)).then(() => col.doc(docId).set(cuerpo)).catch(() => estadoSync(false)); estadoSync(false); });
}
function guardarConfig() { data.config.updatedAt = Date.now(); guardarLocal(); remoto("config", data.config); }
function guardarMes(ym) { if (!data.meses[ym]) data.meses[ym] = { movs: [] }; guardarLocal(); remoto("m-" + ym, data.meses[ym]); }
function estadoSync(ok) {
  const el = $("#sync"); el.classList.toggle("ok", ok);
  el.querySelector("span").textContent = ok ? "Sincronizado" : "Este dispositivo";
}

(async function conectar() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    col = db.collection("data/users/" + id);
    col.onSnapshot(snap => {
      if (snap.empty) {
        if (!snap.metadata.fromCache && !remotoListo) {
          remotoListo = true;
          remoto("config", data.config);
          Object.keys(data.meses).forEach(ym => remoto("m-" + ym, data.meses[ym]));
          estadoSync(true);
        }
        return;
      }
      remotoListo = true;
      const nuevo = { config: data.config, meses: {} };
      snap.docs.forEach(d => {
        const b = d.data();
        if (d.id === "config") nuevo.config = clone(b);
        else if (d.id.startsWith("m-")) nuevo.meses[d.id.slice(2)] = clone(b);
      });
      data = nuevo; normalizar(); guardarLocal(); estadoSync(true); render();
    }, () => estadoSync(false));
  } catch (e) { estadoSync(false); }
})();


/* ============ Tarjetas de crédito ============ */
const tasaMesT = t => t?.tasaEA ? emv(t.tasaEA) / 100 : 0;
function cuotaFija(P, n, i) { if (n <= 1 || !i) return Math.round(P / n); return Math.round(P * i / (1 - Math.pow(1 + i, -n))); }
function primerPagoYm(t, fecha) {
  const [y, m, d] = fecha.split("-").map(Number);
  let corte = `${y}-${pad(m)}`;
  if (d > t.diaCorte) corte = ymShift(corte, 1);
  return t.diaPago > t.diaCorte ? corte : ymShift(corte, 1);
}
function planCompra(c) {
  const t = tarjeta(c.tarjetaId); if (!t) return [];
  const n = Math.max(1, c.cuotas || 1), i = n > 1 ? tasaMesT(t) : 0;
  const fija = cuotaFija(c.monto, n, i);
  let saldo = c.monto, ym = primerPagoYm(t, c.fecha); const out = [];
  for (let k = 1; k <= n; k++) {
    const interes = Math.round(saldo * i);
    const capital = k === n ? saldo : Math.min(saldo, fija - interes);
    saldo -= capital;
    out.push({ k, ym, cuota: capital + interes, interes, capital, saldo });
    ym = ymShift(ym, 1);
  }
  return out;
}
const comprasTarjeta = tid => todos().filter(m => m.tipo === "credito" && m.tarjetaId === tid);
const descCompra = c => c.nota || cat(c.categoriaId)?.nombre || "Compra";
const pagoTarjetaRegistrado = (t, ym) => movsMes(ym).some(m => m.tipo === "gasto" && m.tarjetaId === t.id);
function cuotaTarjetaMes(t, ym) {
  const det = [];
  for (const c of comprasTarjeta(t.id)) { const q = planCompra(c).find(x => x.ym === ym); if (q) det.push({ compra: c, n: c.cuotas || 1, ...q }); }
  const total = det.reduce((s, q) => s + q.cuota, 0) + (t.cuotaManejo || 0);
  return { total, det };
}
function estadoCompra(c) {
  const t = tarjeta(c.tarjetaId); if (!t) return null;
  const actual = ymOf(hoy()), pagado = pagoTarjetaRegistrado(t, actual);
  const pend = planCompra(c).filter(q => q.ym > actual || (q.ym === actual && !pagado));
  if (!pend.length) return null;
  return { compra: c, prox: pend[0], restantes: pend.length, n: c.cuotas || 1, saldo: pend.reduce((s, q) => s + q.capital, 0) };
}
const vigentesTarjeta = t => comprasTarjeta(t.id).map(estadoCompra).filter(Boolean).sort((a, b) => b.compra.fecha.localeCompare(a.compra.fecha));
const saldoTarjeta = t => vigentesTarjeta(t).reduce((s, v) => s + v.saldo, 0);


/* ============ Bolsillos ============ */
const bolsillosActivos = ym => data.config.bolsillos.filter(b => b.activo !== false && (!ym || b.desde <= ym));
const bolsilloDeCat = cid => data.config.bolsillos.find(b => b.activo !== false && b.categoriaId === cid);
const consumeBolsillo = (b, m) => (m.tipo === "gasto" || m.tipo === "credito") && m.categoriaId === b.categoriaId && !m.recurrenteId;
const gastadoBolsillo = (b, ym) => movsMes(ym).filter(m => consumeBolsillo(b, m)).reduce((s, m) => s + m.monto, 0);
function disponibleBolsillo(b, ym, prof = 0) {
  if (ym < b.desde) return 0;
  let d = b.monto;
  const prev = ymShift(ym, -1);
  if (b.acumula && prev >= b.desde && prof < 36) d += disponibleBolsillo(b, prev, prof + 1) - gastadoBolsillo(b, prev);
  return d;
}
function semanasMes(ym) {
  const u = ultimoDia(ym), out = [];
  for (let d = 1; d <= u; d += 7) out.push({ desde: d, hasta: Math.min(u, d + 6) });
  if (out.length > 4 && out[out.length - 1].hasta - out[out.length - 1].desde < 2) { const x = out.pop(); out[out.length - 1].hasta = x.hasta; }
  return out;
}
function estadoBolsillo(b, ym) {
  const disp = disponibleBolsillo(b, ym), gastado = gastadoBolsillo(b, ym), u = ultimoDia(ym);
  const movs = movsMes(ym).filter(m => consumeBolsillo(b, m));
  const hoyD = ymOf(hoy()) === ym ? new Date().getDate() : ym < ymOf(hoy()) ? u : 0;
  const semanas = semanasMes(ym).map(w => {
    const dias = w.hasta - w.desde + 1, asignado = Math.round(disp * dias / u);
    const g = movs.filter(m => { const d = +m.fecha.slice(8, 10); return d >= w.desde && d <= w.hasta; }).reduce((s, m) => s + m.monto, 0);
    return { ...w, asignado, gastado: g, actual: hoyD >= w.desde && hoyD <= w.hasta };
  });
  const esperado = hoyD ? disp * hoyD / u : 0;
  return { disp, gastado, queda: disp - gastado, semanas, pctUsado: disp > 0 ? gastado / disp : 0, pctMes: hoyD / u, esperado, arrastre: disp - b.monto };
}
const mil = n => (n < 0 ? "−" : "") + "$" + (Math.abs(n) >= 1000 ? Math.round(Math.abs(n) / 1000) + " mil" : Math.abs(Math.round(n)));

/* ============ Cálculos ============ */
function resumen(ym) {
  const movs = movsMes(ym);
  let ingresos = 0, variables = 0, fijos = 0, deudas = 0, ahorro = 0, credito = 0, prestamos = 0;
  for (const m of movs) {
    if (m.tipo === "ingreso") ingresos += m.monto;
    else if (m.tipo === "gasto") { if (m.recurrenteId) fijos += m.monto; else if (m.deudaId || m.tarjetaId) deudas += m.monto; else variables += m.monto; }
    else if (m.tipo === "ahorro") ahorro += m.monto;
    else if (m.tipo === "credito") credito += m.monto;
    else if (m.tipo === "transferencia") variables += m.gmf || 0;
    else if (m.tipo === "prestamo") prestamos += (m.dir === "di" || m.dir === "abono") ? m.monto : -m.monto;
  }
  const actual = ymOf(hoy());
  const pendFijos = data.config.recurrentes.filter(r => r.activo !== false && !movs.some(m => m.recurrenteId === r.id));
  const pendDeudas = data.config.deudas.filter(d => saldoDeuda(d) > 0 && !movs.some(m => m.deudaId === d.id));
  const pendTarjetas = data.config.tarjetas.map(t => ({ t, total: cuotaTarjetaMes(t, ym).total })).filter(x => x.total > 0 && !pagoTarjetaRegistrado(x.t, ym));
  const cuentaPend = ym >= actual;
  const pendiente = cuentaPend ? pendFijos.reduce((s, r) => s + r.monto, 0) + pendDeudas.reduce((s, d) => s + Math.min(d.cuota, saldoDeuda(d)), 0) + pendTarjetas.reduce((s, x) => s + x.total, 0) : 0;
  const reservado = cuentaPend ? bolsillosActivos(ym).reduce((s, b) => s + Math.max(0, disponibleBolsillo(b, ym) - gastadoBolsillo(b, ym)), 0) : 0;
  const libre = ingresos - variables - fijos - deudas - ahorro - pendiente - reservado - prestamos;
  return { ingresos, variables, fijos, deudas, ahorro, credito, prestamos, pendiente, reservado, libre, pendFijos, pendDeudas, pendTarjetas, cuentaPend };
}
const pagadoDeuda = d => todos().filter(m => m.deudaId === d.id).reduce((s, m) => s + m.monto, 0);
const saldoDeuda = d => Math.max(0, d.saldoInicial - pagadoDeuda(d));
const ahorradoMeta = mt => todos().filter(m => m.metaId === mt.id).reduce((s, m) => s + m.monto, 0);
function saldoCuenta(c) {
  let s = c.saldoInicial || 0;
  for (const m of todos()) {
    if (m.tipo === "transferencia") { if (m.cuentaId === c.id) s -= m.monto + (m.gmf || 0); if (m.cuentaDestinoId === c.id) s += m.monto; continue; }
    if (m.cuentaId !== c.id || m.tipo === "credito") continue;
    if (m.tipo === "ajuste") s += m.monto;
    else if (m.tipo === "prestamo") s += (m.dir === "recibi" || m.dir === "cobro") ? m.monto : -m.monto;
    else s += m.tipo === "ingreso" ? m.monto : -m.monto;
  }
  return s;
}
/* Personas: saldo > 0 = te debe; < 0 = le debes */
const movsPersona = id => todos().filter(m => m.tipo === "prestamo" && m.personaId === id);
const saldoPersona = id => movsPersona(id).reduce((s, m) => s + ((m.dir === "di" || m.dir === "abono") ? m.monto : -m.monto), 0);
function personaPorNombre(nombre) {
  const n = nombre.trim(); if (!n) return null;
  let p = data.config.personas.find(x => norm(x.nombre) === norm(n));
  if (!p) { p = { id: uid(), nombre: n }; data.config.personas.push(p); guardarConfig(); }
  return p;
}

/* ============ Lo colombiano: nómina, quincenas, prestaciones ============ */
function nomina(p = data.config.perfil) {
  if (!p) return null;
  const L = data.config.legal, smm = L.smmlv, sal = p.salario || 0;
  const items = []; let bruto = sal;
  if (p.tipo === "empleado") {
    if (p.aux) { bruto += L.aux; items.push(["Auxilio de transporte", L.aux, 1]); }
    items.push(["Salud (4%)", sal * 0.04, -1], ["Pensión (4%)", sal * 0.04, -1]);
    const r = sal / smm;
    const fsp = r >= 20 ? .02 : r >= 19 ? .018 : r >= 18 ? .016 : r >= 17 ? .014 : r >= 16 ? .012 : r >= 4 ? .01 : 0;
    if (fsp) items.push([`Fondo de Solidaridad (${String(+(fsp*100).toFixed(1)).replace(".", ",")}%)`, sal * fsp, -1]);
  } else if (p.tipo === "independiente") {
    const ibc = Math.max(smm, sal * 0.4);
    items.push(["Salud (12,5% del IBC)", ibc * .125, -1], ["Pensión (16% del IBC)", ibc * .16, -1], ["ARL riesgo I (0,522%)", ibc * .00522, -1]);
  }
  const desc = items.filter(i => i[2] < 0).reduce((s, i) => s + i[1], 0);
  const calculado = Math.round(bruto - desc);
  const llega = p.netoManual || (p.tipo === "independiente" ? sal : calculado);
  return { salario: sal, items: items.map(([n, v, sg]) => [n, Math.round(v), sg]), calculado, llega,
    aportesIndep: p.tipo === "independiente" ? Math.round(desc) : 0 };
}
function pagosSalario(ym) {
  const p = data.config.perfil, n = nomina();
  if (!p || !n || !n.llega) return [];
  const u = ultimoDia(ym);
  if (p.frecuencia === "quincenal") {
    const a = Math.round(n.llega / 2);
    return [{ k: "q1", nombre: "Primera quincena", dia: Math.min(p.dia1 || 15, u), monto: a },
            { k: "q2", nombre: "Segunda quincena", dia: Math.min(p.dia2 || 30, u), monto: n.llega - a }];
  }
  return [{ k: "m", nombre: p.tipo === "empleado" ? "Salario del mes" : "Ingreso del mes", dia: Math.min(p.dia1 || 30, u), monto: n.llega }];
}
const salarioPendiente = ym => pagosSalario(ym).filter(x => !movsMes(ym).some(m => m.nomina === x.k));
function planQuincenas(ym) {
  const pagos = pagosSalario(ym);
  if (pagos.length !== 2) return null;
  const obl = [
    ...data.config.recurrentes.filter(r => r.activo !== false).map(r => ({ nombre: r.nombre, monto: r.monto, dia: r.dia })),
    ...data.config.deudas.filter(d => saldoDeuda(d) > 0).map(d => ({ nombre: d.nombre, monto: Math.min(d.cuota, saldoDeuda(d)), dia: d.dia })),
    ...data.config.tarjetas.map(t => ({ nombre: "💳 " + t.nombre, monto: cuotaTarjetaMes(t, ym).total, dia: t.diaPago })).filter(o => o.monto > 0),
  ].sort((a, b) => a.dia - b.dia);
  const q = [
    { titulo: "1 al 15", entra: pagos[0].monto, items: obl.filter(o => o.dia <= 15) },
    { titulo: `16 al ${ultimoDia(ym)}`, entra: pagos[1].monto, items: obl.filter(o => o.dia > 15) },
  ];
  q.forEach(x => { x.sale = x.items.reduce((s, o) => s + o.monto, 0); x.queda = x.entra - x.sale; });
  return q;
}
function prestaciones() {
  const p = data.config.perfil, n = nomina();
  if (!p || p.tipo !== "empleado" || p.prima === false || !n) return [];
  const base = n.salario + (p.aux ? data.config.legal.aux : 0);
  const h = new Date(); h.setHours(0, 0, 0, 0);
  const ev = [];
  for (const y of [h.getFullYear(), h.getFullYear() + 1]) {
    ev.push({ fecha: new Date(y, 0, 31), nombre: "Intereses a las cesantías", monto: Math.round(base * .12), liquido: true, nota: "Te los paga la empresa a tu cuenta (12% de las cesantías)." });
    ev.push({ fecha: new Date(y, 1, 14), nombre: "Cesantías", monto: base, liquido: false, nota: "Van a tu fondo, no a tu cuenta. Sirven para vivienda, estudio o si quedas sin empleo." });
    ev.push({ fecha: new Date(y, 5, 30), nombre: "Prima de junio", monto: Math.round(base / 2), liquido: true, nota: "Medio salario si trabajaste todo el semestre." });
    ev.push({ fecha: new Date(y, 11, 20), nombre: "Prima de diciembre", monto: Math.round(base / 2), liquido: true, nota: "Medio salario si trabajaste todo el semestre." });
  }
  return ev.filter(e => e.fecha >= h).sort((a, b) => a.fecha - b.fecha).slice(0, 4)

function cuotasRestantes(d) {
  const saldo = saldoDeuda(d);

  if (d.cuota <= saldo * i) return Infinity;
  return Math.ceil(-Math.log(1 - saldo * i / d.cuota) / Math.log(1 + i));

function leerMonto(t) {

}

  const cn = r.categoriaId ? norm(cat(r.categoriaId)?.nombre) : "";

const barHtml = seg => { const base = Math.max(1, seg.reduce((s, x) => s + x[1], 0));

function proximos(ym) {

      return { ico: cat(r.categoriaId)?.icono || "📅", nombre: r.nombre, dia: r.dia, monto: pago ? pago.monto : r.monto, pagado: !!pago, tipo: "Fijo",
        attrs: pago ? `data-editfijo="${r.id}"` : `data-pagar="fijo:${r.id}"` }; }),
    ...data.config.deudas.filter(d => saldoDeuda(d) > 0 || movs.some(m => m.deudaId === d.id)).map(d => { const pago = movs.find(m => m.deudaId === d.id);
      return { ico: "🏦", nombre: d.nombre, dia: d.dia, monto: pago ? pago.monto : Math.min(d.cuota, saldoDeuda(d)), pagado: !!pago, tipo: "Crédito",
        attrs: pago ? `data-vercredito="${d.id}"` : `data-pagar="deuda:${d.id}"` }; }),
    ...data.config.tarjetas.map(t => { const c = cuotaTarjetaMes(t, ym), pago = movsMes(ym).find(m => m.tipo === "gasto" && m.tarjetaId === t.id);

/* ============ Apariencia ============ */
const LS_TEMA = "libreta-tema";
const TEMAS = [["morado", "Morado", "#4E2A84"], ["verde", "Verde", "#0E6A4A"], ["azul", "Azul", "#1C4E9B"], ["grafito", "Grafito", "#2B2F38"]];
function tema() { try { return { color: "morado", modo: "auto", ...JSON.parse(localStorage.getItem(LS_TEMA) || "{}") }; } catch (e) { return { color: "morado", modo: "auto" }; } }
function aplicarTema(cambio) {
  const t = { ...tema(), ...(cambio || {}) };
  try { localStorage.setItem(LS_TEMA, JSON.stringify(t)); } catch (e) {}
  const r = document.documentElement;
  if (t.color === "morado") delete r.dataset.color; else r.dataset.color = t.color;
  if (t.modo === "auto") delete r.dataset.theme; else r.dataset.theme = t.modo;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(r).getPropertyValue("--paper").trim() || "#F5F3F8";
}
aplicarTema();

            nota: "Su parte de " + (m.nota || cat(m.categoriaId)?.nombre || "un gasto").toLowerCase() }); }
        if (st.fav && data.config.favoritos.length < 12) {
          const c = cat(st.catSel);
          const nombre = m.nota || (esTr ? `${cuenta(m.cuentaId)?.nombre} → ${cuenta(m.cuentaDestinoId)?.nombre}` : c?.nombre || "Rápido");
          data.config.favoritos.push({ id: uid(), nombre: nombre.slice(0, 24), icono: esTr ? "🔁" : c?.icono || "⭐", tipo: esTr ? "transferencia" : T, monto,

          guardarConfig();

        cerrar(); render();
        toast(editando ? "Cambios guardados" : m.tipo === "credito" ? `Compra a ${st.nCuotas} cuota${st.nCuotas > 1 ? "s" : ""} registrada` : comp ? `Registrado · ${st.per.trim()} te debe ${fmt(comp)}` : "Registrado");
      };
      const del = $s("#eliminar");
      if (del) del.onclick = () => {
        if (!confirm("¿Eliminar este movimiento?")) return;
        const y = ymOf(mov.fecha); data.meses[y].movs = data.meses[y].movs.filter(x => x.id !== mov.id);
        guardarMes(y); cerrar(); toast("Eliminado"); render();
      };
    });
  };
  dibujar();
}

    mi.addEventListener("input", rep); nom.addEventListener("input", autoCat); rep();

      data.config.bolsillos = data.config.bolsillos.filter(x => x.id !== b.id); guardarConfig(); cerrar(); render(); };

/* ============ Análisis con Claude ============ */
/* ============ Asesor Libreta: funciona dentro del celular, sin internet y sin costo ============ */
let iaCtl = null;
function setIA(t) { ui.iaTexto = t; const b = $("#ia"); if (b) { b.hidden = false; b.textContent = t; } }
const redondo = v => Math.round(v / 1000) * 1000;
const pctTxt = x => Math.round(x * 100) + "%";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function cuotasDelMes(ym) {
  return data.config.tarjetas.reduce((s, t) => s + cuotaTarjetaMes(t, ym).total, 0) +
    data.config.deudas.filter(d => saldoDeuda(d) > 0).reduce((s, d) => s + Math.min(d.cuota, saldoDeuda(d)), 0);
}
function gastoPorCat(ym) {
  const o = {};
  movsMes(ym).filter(m => (m.tipo === "gasto" && !m.recurrenteId && !m.deudaId && !m.tarjetaId) || m.tipo === "credito")
    .forEach(m => o[m.categoriaId] = (o[m.categoriaId] || 0) + m.monto);
  return o;
}
function buscarCat(t) {
  const cats = data.config.categorias.filter(c => c.tipo === "gasto");
  let c = cats.find(c => t.includes(" " + norm(c.nombre)));
  if (!c) for (const [clave, pal] of PALABRAS) if (new RegExp(`\\b(${pal})\\b`).test(t)) { c = cats.find(x => norm(x.nombre) === clave); if (c) break; }
  return c;
}
function buscarDeuda(t) {
  const tj = data.config.tarjetas.find(x => norm(x.nombre).split(/\s+/).some(w => w.length > 3 && t.includes(w)));
  if (tj) return { tj };
  const d = data.config.deudas.find(x => norm(x.nombre).split(/\s+/).some(w => w.length > 3 && t.includes(w)));
  return d ? { d } : {};
}

function analisisLocal() {
  const ym = ui.mes, r = resumen(ym), rt = ritmo(ym), n = nomina(), ing = n?.llega || 0, out = [];
  const libre = rt ? rt.libre : r.libre;
  out.push(libre >= 0
    ? `• Vas con ${fmt(libre)} libres este mes${rt && libre > 0 && rt.rest > 1 ? `: unos ${fmt(rt.porDia)} por día hasta fin de mes` : ""}.`
    : `• Este mes tus compromisos superan lo que entra por ${fmt(-libre)}. Prioriza fijos y cuotas, y frena lo que pueda esperar.`);
  const a = gastoPorCat(ym), b = gastoPorCat(ymShift(ym, -1));
  const top = Object.entries(a).sort((x, y) => y[1] - x[1]).slice(0, 3);
  if (top.length) out.push(`• Donde más se te va: ${top.map(([id, v]) => `${cat(id)?.nombre || "Otros"} (${fmt(v)})`).join(", ")}.`);
  const factor = rt ? new Date().getDate() / ultimoDia(ym) : 1;
  let peor = null;
  for (const [id, v] of Object.entries(a)) { const prev = (b[id] || 0) * factor;
    if (prev > 20000 && v > prev * 1.25 && (!peor || v - prev > peor.d)) peor = { id, d: v - prev, pct: Math.round((v / prev - 1) * 100) }; }
  if (peor) out.push(`• ${cat(peor.id)?.nombre} va ${peor.pct}% por encima de lo que llevabas a esta altura el mes pasado.`);
  const cuotas = cuotasDelMes(ymOf(hoy()));
  if (ing && cuotas) { const pc = cuotas / ing;
    out.push(`• Tus cuotas de este mes (${fmt(cuotas)}) son el ${pctTxt(pc)} de tu ingreso${pc > .3 ? ", por encima del 30% recomendado: no tomes deudas nuevas." : ", dentro de lo sano."}`); }
  if (ing) { const pc = r.ahorro / ing;
    out.push(pc >= .1 ? `• Llevas ${fmt(r.ahorro)} ahorrados, el ${pctTxt(pc)} de tu ingreso. ¡Vas muy bien!`
      : `• Llevas ${fmt(r.ahorro)} ahorrados. Apartando ${fmt(redondo(ing * .1))} apenas te paguen, llegas al 10%.`); }
  bolsillosActivos(ym).forEach(bo => { const e = estadoBolsillo(bo, ym);
    if (e.queda < 0) out.push(`• Te pasaste del bolsillo ${bo.nombre} por ${fmt(-e.queda)}.`);
    else if (rt && e.pctUsado > e.pctMes + .2) out.push(`• Vas rápido con ${bo.nombre}: llevas el ${pctTxt(e.pctUsado)} y va el ${pctTxt(e.pctMes)} del mes.`); });
  const urg = consejos(ym).find(t => t.nivel === "alerta");
  if (urg) out.push(`• ${urg.titulo}. ${urg.texto}`);
  if (!n) out.push("• Configura tu ingreso en ⚙️ para que el análisis sea más completo.");
  return out.join("\n\n");
}

function respAlcanza(t, monto, cuotas) {
  const n = nomina(), ing = n?.llega || 0, actual = ymOf(hoy()), rt = ritmo(actual), libre = rt ? rt.libre : resumen(actual).libre;
  const conTarjeta = /\b(tarjeta|credito|visa|master|cuotas?)\b/.test(t) || cuotas > 1;
  const tj = buscarDeuda(t).tj || (conTarjeta ? data.config.tarjetas[0] : null);
  const L = [];
  if (tj) {
    const nC = cuotas || 1, p = planCompra({ monto, cuotas: nC, tarjetaId: tj.id, fecha: hoy() });
    const int = p.reduce((s, q) => s + q.interes, 0), cuota = p[0].cuota;
    L.push(`Con ${tj.nombre} a ${nC} cuota${nC > 1 ? "s" : ""}: pagarías ${fmt(cuota)} al mes desde ${mesNombre(p[0].ym)}${int ? `, con ${fmt(int)} de intereses (total ${fmt(monto + int)})` : ", sin intereses"}.`);
    if (ing) { const carga = (cuotasDelMes(actual) + cuota) / ing;
      L.push(carga > .4 ? `No te lo recomiendo: tus cuotas quedarían en el ${pctTxt(carga)} de tu ingreso, muy por encima del 30% sano.`
        : carga > .3 ? `Se puede, pero quedas justo: tus cuotas llegarían al ${pctTxt(carga)} de tu ingreso (lo sano es máximo 30%).`
        : `Sí te alcanza: tus cuotas quedarían en el ${pctTxt(carga)} de tu ingreso, dentro de lo sano.`); }
    if (tj.cupo) { const disp = tj.cupo - saldoTarjeta(tj); if (monto > disp) L.push(`Ojo: el cupo disponible de ${tj.nombre} es ${fmt(disp)}, no alcanza para esta compra.`); }
    if (nC > 6) { const p6 = planCompra({ monto, cuotas: 6, tarjetaId: tj.id, fecha: hoy() }), i6 = p6.reduce((s, q) => s + q.interes, 0);
      if (int - i6 > 20000) L.push(`A 6 cuotas la cuota sería ${fmt(p6[0].cuota)} y te ahorrarías ${fmt(int - i6)} en intereses.`); }
  } else {
    if (conTarjeta) L.push("No tienes tarjetas registradas; te respondo como compra de contado.");
    if (libre >= monto) L.push(`Sí te alcanza de contado: tienes ${fmt(libre)} libres este mes y quedarías con ${fmt(libre - monto)}.${ing && libre - monto < ing * .1 ? " Pero quedarías muy justo para imprevistos." : ""}`);
    else {
      L.push(`Hoy no te alcanza de contado: tienes ${fmt(Math.max(0, libre))} libres y te faltan ${fmt(monto - Math.max(0, libre))}.`);
      if (ing) { const cuota = redondo(ing * .15); L.push(`Si apartas ${fmt(cuota)} al mes en una meta de ahorro, lo juntas en unos ${Math.ceil(monto / cuota)} meses, sin pagar intereses.`); }
    }
    if (data.config.tarjetas.length) { const t0 = data.config.tarjetas[0], p = planCompra({ monto, cuotas: 12, tarjetaId: t0.id, fecha: hoy() });
      L.push(`Como referencia: a 12 cuotas con ${t0.nombre} serían ${fmt(p[0].cuota)} al mes y ${fmt(p.reduce((s, q) => s + q.interes, 0))} en intereses.`); }
  }
  if ((!ing || monto > ing * .3) && !data.config.metas.some(m => /emergencia/i.test(m.nombre))) L.push("Antes de compras grandes, lo ideal es tener un fondo de emergencia.");
  return L.join("\n\n");
}

function responder(txt) {
  const t = " " + norm(txt) + " ", actual = ymOf(hoy()), n = nomina(), ing = n?.llega || 0;
  const { monto, cuotas } = leerMonto(t), has = re => re.test(t);
  if (!txt.trim()) return "";
  if (has(/alcanza|puedo comprar|comprar|comprarme|me da para|puedo pagar|darme el gusto|vale la pena|diferir/) && monto) return respAlcanza(t, monto, cuotas);
  if (has(/(ahorrar|juntar|reunir|ahorro)/) && monto) {
    let meses = null; const m1 = t.match(/en (\d{1,2}) mes/); if (m1) meses = +m1[1];
    const mi = MESES.findIndex(mm => t.includes(mm));
    if (!meses && mi >= 0) { const mo = +actual.split("-")[1]; meses = (mi + 1) - mo + ((mi + 1) <= mo ? 12 : 0); }
    if (meses) { const q = data.config.perfil?.frecuencia === "quincenal", porMes = Math.ceil(monto / meses / 1000) * 1000;
      return `Para juntar ${fmt(monto)} en ${meses} mes${meses > 1 ? "es" : ""} necesitas apartar ${fmt(porMes)} al mes${q ? ` (unos ${fmt(Math.ceil(porMes / 2000) * 1000)} por quincena)` : ""}.` +
        (ing ? ` Eso es el ${pctTxt(porMes / ing)} de tu ingreso${porMes / ing > .25 ? ", bastante exigente: considera darte más tiempo." : "."}` : "") + "\n\nCréala en Metas → Ahorro para ir registrando los aportes."; }
    return ing ? `Apartando el 10% de tu ingreso (${fmt(redondo(ing * .1))} al mes) juntas ${fmt(monto)} en unos ${Math.ceil(monto / (ing * .1))} meses. Con el 20%, en ${Math.ceil(monto / (ing * .2))}.` : `Dime para cuándo, por ejemplo: "ahorrar ${fmt(monto)} para diciembre".`;
  }
  if (has(/cuanto (puedo )?gastar|me queda (libre|para)|cuanto me queda|por dia|al dia|esta semana/)) {
    const rt = ritmo(actual); if (!rt) return "No pude calcularlo.";
    const semana = Math.min(7, rt.rest);
    return rt.libre <= 0 ? `Este mes ya no te queda libre (${fmt(rt.libre)}). Lo sano es no gastar en nada que no sea esencial hasta tu próximo pago.`
      : rt.rest === 1 ? `Hoy es el último día del mes y te quedan ${fmt(rt.libre)} libres, ya descontando lo que tienes por pagar y lo reservado en bolsillos. Lo que no gastes, pásalo a tu ahorro.`
      : `Te quedan ${fmt(rt.libre)} libres para ${rt.rest} días: unos ${fmt(rt.porDia)} por día, o ${fmt(rt.porDia * semana)} para los próximos ${semana} días. Ya está descontado lo que tienes por pagar y lo reservado en bolsillos.`;
  }
  if (has(/termino de pagar|cuando termino|cuando acabo|cuando salgo/)) {
    const { tj, d } = buscarDeuda(t);
    if (tj) { const v = vigentesTarjeta(tj); if (!v.length) return `${tj.nombre} no tiene compras pendientes.`;
      const ult = v.map(x => planCompra(x.compra).slice(-1)[0].ym).sort().pop(); return `Si no haces compras nuevas, terminas de pagar ${tj.nombre} en ${mesNombre(ult)}.`; }
    if (d) { const c = cuotasRestantes(d); return c === Infinity ? `La cuota de ${d.nombre} no alcanza a cubrir los intereses: así nunca terminas. Habla con el banco o abona a capital.` : `Te faltan unas ${c} cuotas de ${d.nombre}: terminarías hacia ${mesNombre(ymShift(actual, c))}.`; }
  }
  if (has(/abono|abonar|pagar primero|mas cara|salir de deudas|que deuda/)) {
    const cand = [...data.config.deudas.filter(d => saldoDeuda(d) > 0 && d.tasaEA), ...data.config.tarjetas.filter(x => x.tasaEA && saldoTarjeta(x) > 0)].sort((a, b) => b.tasaEA - a.tasaEA);
    if (!cand.length) return "No tienes deudas con tasa registrada. Agrega la tasa E.A. de tus tarjetas y créditos para saber cuál te sale más cara.";
    return `Abona primero a ${cand[0].nombre} (${fmtPct(cand[0].tasaEA)} E.A.), porque es la más cara.${cand.length > 1 ? ` Después sigue ${cand.slice(1).map(x => x.nombre).join(", luego ")}.` : ""} Cuando abones, pide que sea a capital con reducción de plazo.`;
  }
  if (has(/cuanto debo|mis deudas|debo en total|deuda total/)) {
    const tj = data.config.tarjetas.reduce((s, x) => s + saldoTarjeta(x), 0), cr = data.config.deudas.reduce((s, d) => s + saldoDeuda(d), 0);
    const c = cuotasDelMes(actual);
    return `Debes ${fmt(tj + cr)} en total: ${fmt(tj)} en tarjetas y ${fmt(cr)} en créditos. Este mes pagas ${fmt(c)} en cuotas${ing ? `, el ${pctTxt(c / ing)} de tu ingreso` : ""}.`;
  }
  if (has(/prima|cesantias|intereses de/)) {
    const p = prestaciones(); if (!p.length) return "Configura tu ingreso como empleado con contrato laboral (en ⚙️) para calcular prima y cesantías.";
    return p.map(e => `${e.nombre}: unos ${fmt(e.monto)}, a más tardar en ${e.dias} días${e.liquido ? "" : " (va a tu fondo, no a tu cuenta)"}.`).join("\n");
  }
  if (has(/me debe|me deben|le debo|quien/)) {
    const ps = data.config.personas.map(pe => ({ pe, s: saldoPersona(pe.id) })).filter(x => x.s);
    return ps.length ? ps.map(x => x.s > 0 ? `${x.pe.nombre} te debe ${fmt(x.s)}.` : `Le debes a ${x.pe.nombre} ${fmt(-x.s)}.`).join("\n") : "Nadie te debe y no le debes a nadie. 🙌";
  }
  if (has(/quincena/)) {
    const q = planQuincenas(actual); if (!q) return "Configura tu pago como quincenal en ⚙️ para ver el plan por quincena.";
    return q.map((x, i) => `${i ? "Segunda" : "Primera"} quincena: entran ${fmt(x.entra)}, pagos ${fmt(x.sale)}, te quedan ${fmt(x.queda)}.`).join("\n");
  }
  const c = buscarCat(t);
  if (c || has(/gaste|gastado|llevo|cuanto va|se me ha ido|en que se me va/)) {
    if (!c) { const top = Object.entries(gastoPorCat(actual)).sort((x, y) => y[1] - x[1]).slice(0, 4);
      return top.length ? "Este mes lo que más te ha costado:\n" + top.map(([id, v]) => `${cat(id)?.icono || ""} ${cat(id)?.nombre || "Otros"}: ${fmt(v)}`).join("\n") : "Todavía no tienes gastos este mes."; }
    const v = gastoPorCat(actual)[c.id] || 0, prev = gastoPorCat(ymShift(actual, -1))[c.id] || 0, bo = bolsilloDeCat(c.id);
    let s = `Este mes llevas ${fmt(v)} en ${c.nombre}.` + (prev ? ` El mes pasado completo fueron ${fmt(prev)}.` : "");
    if (bo) { const e = estadoBolsillo(bo, actual); s += e.queda >= 0 ? ` Te quedan ${fmt(e.queda)} del bolsillo.` : ` Te pasaste del bolsillo por ${fmt(-e.queda)}.`; }
    return s;
  }
  return "Todavía no sé responder eso 🙂. Prueba preguntando:\n• ¿Me alcanza para un celular de 1,5 millones a 12 cuotas?\n• ¿Cuánto puedo gastar por día?\n• ¿Cuánto llevo en gasolina?\n• ¿A qué deuda abono primero?\n• Quiero ahorrar 2 millones para diciembre";
}

const LS_GEM = "libreta-gemini";
const enLinea = () => navigator.onLine !== false;
function gem() { try { return { key: "", modelo: "gemini-flash-latest", ...JSON.parse(localStorage.getItem(LS_GEM) || "{}") }; } catch (e) { return { key: "", modelo: "gemini-flash-latest" }; } }
const geminiListo = () => !HAY_CLAUDE && !!gem().key;

const SYS_GEM = `Eres el asesor de la app Libreta, de finanzas personales para personas en Colombia. Montos en pesos colombianos (COP).
Ten en cuenta quincenas, prima, cesantías, tarjetas con tasa E.A., compras diferidas a cuotas, bolsillos de Nequi o Daviplata y el 4x1000.
Te doy el cálculo que ya hizo la app: úsalo como base y nunca contradigas sus cifras ni inventes números nuevos.
Escribe en español de Colombia, cálido y directo, sin tecnicismos, en texto plano sin markdown, máximo 130 palabras.
Solo hablas de finanzas personales. Cierra con una línea corta recordando que es orientación general, no asesoría financiera profesional.`;
async function llamarGemini(tarea) {
  const g = gem();
  if (!g.key) throw new Error("sin_llave");
  if (!enLinea()) throw new Error("sin_internet");
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  const cuerpo = { systemInstruction: { parts: [{ text: SYS_GEM }] }, contents: [{ role: "user", parts: [{ text: tarea }] }],
    generationConfig: { temperature: 0.4, maxOutputTokens: 1500 } };
  const pedir = modelo => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
    method: "POST", signal: ctl.signal, headers: { "content-type": "application/json", "x-goog-api-key": g.key }, body: JSON.stringify(cuerpo) });
  try {
    let r = await pedir(g.modelo);
    if (r.status === 404 && g.modelo !== "gemini-2.5-flash") r = await pedir("gemini-2.5-flash");
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 429 ? "limite" : (r.status === 400 || r.status === 401 || r.status === 403) ? "llave" : "servidor");
    const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
    if (!txt) throw new Error("vacio");
    return txt.replace(/\*\*/g, "").replace(/^#+\s*/gm, "");
  } catch (e) {
    if (e.name === "AbortError") throw new Error("tiempo");
    if (e instanceof TypeError) throw new Error("sin_internet");
    throw e;
  } finally { clearTimeout(to); }
}
function motivoGemini(e) {
  return { sin_internet: "Sin conexión con Gemini", limite: "Gemini llegó a su límite gratuito por ahora", llave: "La llave de Gemini no es válida (revísala en ajustes)", tiempo: "Gemini tardó demasiado" }[e?.message] || "Gemini no respondió";

    ${movs.length ? `<div class="h4">Gastos del mes</div><div class="list">${movs.slice(0, 6).map(filaMov).join("")}</div>` : ""}
    <div class="actions"><button class="btn sm" data-gastobolsillo="${b.id}">Registrar gasto</button><button class="btn sm ghost" data-editbolsillo="${b.id}">Editar</button></div>`);
}
function hojaVerMeta(id) {
  const mt = data.config.metas.find(x => x.id === id); if (!mt) return;
  const ah = ahorradoMeta(mt), falta = Math.max(0, mt.meta - ah), pct = mt.meta ? Math.min(100, ah / mt.meta * 100) : 0;
  const meses = mt.fecha ? Math.max(1, mesesEntre(ymOf(hoy()), mt.fecha)) : 0, q = data.config.perfil?.frecuencia === "quincenal";
  const aportes = todos().filter(m => m.metaId === mt.id).sort((a, b) => b.fecha.localeCompare(a.fecha));
  abrir(`<h3>🐷 ${esc(mt.nombre)}</h3>
    <div class="stat3" style="margin-top:0"><div><small>Ahorrado</small><b class="amt save">${fmt(ah)}</b></div><div><small>Meta</small><b>${fmt(mt.meta)}</b></div><div><small>Falta</small><b>${fmt(falta)}</b></div></div>
    <div class="prog"><span style="width:${pct}%;background:var(--save)"></span></div>
    <p class="sub2" style="margin:4px 2px 0">${falta ? (meses ? `Para lograrlo en ${mesNombre(mt.fecha)}, aparta ${fmt(Math.ceil(falta / meses))} al mes${q ? ` (${fmt(Math.ceil(falta / meses / 2))} por quincena)` : ""}.` : `Te faltan ${fmt(falta)}.`) : "¡Meta cumplida! 🎉"}</p>
    ${aportes.length ? `<div class="h4">Aportes</div><div class="list">${aportes.slice(0, 5).map(filaMov).join("")}</div>` : ""}
    <div class="actions"><button class="btn sm" data-aportar="${mt.id}">Aportar</button><button class="btn sm ghost" data-editmeta="${mt.id}">Editar</button></div>`);
}


function hojaVerPersona(id) {
  const pe = persona(id); if (!pe) return;
  const sp = saldoPersona(id), movs = movsPersona(id).sort((a, b) => (b.fecha + b.creado).localeCompare(a.fecha + a.creado));
  abrir(`<h3>🤝 ${esc(pe.nombre)}</h3>
    <section class="hero sm" style="padding:0"><p class="lbl">${sp > 0 ? "Te debe" : sp < 0 ? "Le debes" : "Están a paz y salvo"}</p>
      <div class="big" style="color:${sp > 0 ? "var(--in)" : sp < 0 ? "var(--out)" : "var(--ink)"}">${fmt(Math.abs(sp))}</div></section>
    <div class="actions">
      ${sp > 0 ? `<button class="btn sm" data-prestamo="${id}|cobro">Me pagó</button>` : ""}
      ${sp < 0 ? `<button class="btn sm" data-prestamo="${id}|abono">Le pagué</button>` : ""}
      <button class="btn sm ghost" data-prestamo="${id}|di">Le presté</button>
      <button class="btn sm ghost" data-prestamo="${id}|recibi">Me prestó</button>
    </div>
    ${movs.length ? `<div class="h4">Historial</div><div class="list">${movs.map(filaMov).join("")}</div>` : ""}
    <div class="actions"><button class="btn sm ghost" id="ren">Cambiar nombre</button>${!movs.length ? `<button class="btn sm danger" id="del">Eliminar</button>` : ""}</div>`, s => {
    s.querySelector("#ren").onclick = () => { const n = prompt("Nuevo nombre", pe.nombre); if (n && n.trim()) { pe.nombre = n.trim(); guardarConfig(); hojaVerPersona(id); render(); } };
    const d = s.querySelector("#del"); if (d) d.onclick = () => { data.config.personas = data.config.personas.filter(x => x.id !== id); guardarConfig(); cerrar(); render(); };
  });
}
function hojaPrestamo(personaId, dir) {
  const pe = persona(personaId), sp = pe ? saldoPersona(pe.id) : 0;
  const titulos = { di: "Le presté", recibi: "Me prestó", cobro: "Me pagó", abono: "Le pagué" };
  const sug = (dir === "cobro" && sp > 0) || (dir === "abono" && sp < 0) ? Math.abs(sp) : 0;
  const sale = dir === "di" || dir === "abono";
  abrir(`<h3>${titulos[dir]}${pe ? " · " + esc(pe.nombre) : ""}</h3>
    ${pe ? "" : `<div class="seg">${Object.entries(titulos).slice(0, 2).map(([k, n]) => `<button data-dir="${k}" class="${dir===k?"on":""}">${n}</button>`).join("")}</div>
      <div class="field"><label for="prNom">¿Quién?</label><input id="prNom" list="dlPer2" maxlength="30" placeholder="Nombre"><datalist id="dlPer2">${data.config.personas.map(p => `<option value="${esc(p.nombre)}">`).join("")}</datalist></div>`}
    <div class="field"><label for="prMonto">Monto</label><input id="prMonto" class="money" inputmode="numeric" placeholder="$0" value="${sug ? sug.toLocaleString("es-CO") : ""}"></div>
    <div class="row2">
      <div class="field"><label for="prCuenta" id="lCta">${sale ? "Salió de" : "Entró a"}</label><select id="prCuenta">${opcCuentas()}</select></div>
      <div class="field"><label for="prFecha">Fecha</label><input id="prFecha" type="date" value="${fechaDefault()}"></div>
    </div>
    <div class="field"><label for="prNota">Nota (opcional)</label><input id="prNota" maxlength="60" placeholder="Ej: para el arreglo de la moto"></div>
    <button class="btn full" id="ok">Guardar</button>`, s => {
    montoInput(s.querySelector("#prMonto"));
    s.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { dir = b.dataset.dir; s.querySelectorAll("[data-dir]").forEach(x => x.classList.toggle("on", x === b));
      s.querySelector("#lCta").textContent = dir === "di" ? "Salió de" : "Entró a"; });
    s.querySelector("#ok").onclick = () => {
      const monto = num(s.querySelector("#prMonto").value); if (!monto) return toast("Escribe un monto");
      const p = pe || personaPorNombre(s.querySelector("#prNom").value); if (!p) return toast("Escribe el nombre");
      agregarMov({ id: uid(), creado: new Date().toISOString(), tipo: "prestamo", dir, personaId: p.id, monto,
        fecha: s.querySelector("#prFecha").value || hoy(), cuentaId: s.querySelector("#prCuenta").value, nota: s.querySelector("#prNota").value.trim() });
      render(); hojaVerPersona(p.id); toast("Guardado");
    };
  });
}
function hojaFavoritos() {
  const fs = data.config.favoritos;
  abrir(`<h3>Registros rápidos</h3><p class="sub2" style="margin:-8px 0 14px">Aparecen arriba al tocar +. Crea uno marcando ⭐ al registrar un gasto.</p>
    ${fs.length ? `<div class="list">${fs.map(f => `<div class="item"><span class="ico">${f.icono || "⭐"}</span>
      <span class="grow"><span class="t">${esc(f.nombre)}</span><span class="s">${f.fuente?.startsWith("t:") ? "💳 " + esc(tarjeta(f.fuente.slice(2))?.nombre || "") : esc(cuenta(f.fuente?.slice(2))?.nombre || "")}</span></span>
      <span class="amt">${fmt(f.monto)}</span><button class="iconbtn" data-borrarfav="${f.id}" aria-label="Eliminar ${esc(f.nombre)}">🗑️</button></div>`).join("")}</div>` : `<p class="hint">Aún no tienes registros rápidos.</p>`}`, s => {
    s.querySelectorAll("[data-borrarfav]").forEach(b => b.onclick = () => { data.config.favoritos = data.config.favoritos.filter(x => x.id !== b.dataset.borrarfav); guardarConfig(); hojaFavoritos(); });
  });
}


/* ============ Categorías ============ */
const EMOJIS = ["🛒","🍔","☕","🍺","🚌","⛽","🚗","🏍️","🏠","💡","📱","💻","💊","🏋️","💈","👕","🎉","🎬","🎮","✈️","🐶","👶","📚","🎓","🎁","🔧","🧾","💳","🏦","💼","🧰","📈","🛍️","🍼","🧴","❤️"];
function usosCategoria(id) {
  return {
    movs: todos().filter(m => m.categoriaId === id).length,
    fijos: data.config.recurrentes.filter(r => r.categoriaId === id).length,
    bolsillo: data.config.bolsillos.find(b => b.categoriaId === id) || null,
  };
}
function hojaCategorias(tipo = "gasto") {
  const cats = data.config.categorias.filter(c => c.tipo === tipo);
  abrir(`<h3>Categorías</h3>
    <div class="seg">${[["gasto", "Gastos"], ["ingreso", "Ingresos"]].map(([k, n]) => `<button class="${tipo === k ? "on" : ""}" data-tcat="${k}">${n}</button>`).join("")}</div>
    <div class="list">${cats.map(c => { const u = usosCategoria(c.id);
      return `<button class="item" data-editcat="${c.id}"><span class="ico">${c.icono}</span>
        <span class="grow"><span class="t">${esc(c.nombre)}</span><span class="s">${u.movs ? `${u.movs} movimiento${u.movs === 1 ? "" : "s"}` : "Sin movimientos"}${u.bolsillo ? " · tiene bolsillo" : ""}</span></span>${chev}</button>`; }).join("")}</div>
    <div class="actions"><button class="btn full" id="nueva">+ Nueva categoría de ${tipo === "gasto" ? "gasto" : "ingreso"}</button></div>`, s => {
    s.querySelectorAll("[data-tcat]").forEach(b => b.onclick = () => hojaCategorias(b.dataset.tcat));
    s.querySelectorAll("[data-editcat]").forEach(b => b.onclick = () => hojaCategoria(b.dataset.editcat, tipo, () => hojaCategorias(tipo)));
    s.querySelector("#nueva").onclick = () => hojaCategoria(null, tipo, () => hojaCategorias(tipo));
  });
}
function hojaCategoria(id, tipo, alTerminar) {
  const c = data.config.categorias.find(x => x.id === id);
  tipo = c?.tipo || tipo || "gasto";
  const u = c ? usosCategoria(c.id) : null;
  const otras = data.config.categorias.filter(x => x.tipo === tipo && x.id !== id);
  let icono = c?.icono || (tipo === "gasto" ? "🛍️" : "💼");
  abrir(`<h3>${c ? "Editar categoría" : `Nueva categoría de ${tipo === "gasto" ? "gasto" : "ingreso"}`}</h3>
    <div class="row2" style="grid-template-columns:70px 1fr">
      <div class="field"><label for="kIcono">Ícono</label><input id="kIcono" maxlength="4" style="text-align:center;font-size:1.4rem;padding:8px" value="${esc(icono)}"></div>
      <div class="field"><label for="kNombre">Nombre</label><input id="kNombre" maxlength="24" placeholder="${tipo === "gasto" ? "Ej: Mascota, Gimnasio, Moto" : "Ej: Arriendo que recibo, Ventas"}" value="${esc(c?.nombre || "")}"></div>
    </div>
    <div class="catgrid" style="grid-template-columns:repeat(6,1fr);margin-bottom:16px">${EMOJIS.map(e => `<button type="button" class="${e === icono ? "on" : ""}" data-emo="${e}" style="padding:8px 0"><span class="e">${e}</span></button>`).join("")}</div>
    <button class="btn full" id="ok">Guardar</button>
    ${c ? `<div class="h4">Eliminar</div>
      ${u.bolsillo ? `<p class="hint">Esta categoría tiene el bolsillo <b>${esc(u.bolsillo.nombre)}</b>. Elimina o cambia ese bolsillo primero.</p>`
        : otras.length ? `${u.movs || u.fijos ? `<div class="field"><label for="kMover">Pasar sus ${u.movs + u.fijos} registro${u.movs + u.fijos === 1 ? "" : "s"} a</label>
            <select id="kMover">${otras.map(o => `<option value="${o.id}">${o.icono} ${esc(o.nombre)}</option>`).join("")}</select></div>` : ""}
          <button class="btn danger full" id="del">Eliminar categoría</button>`
        : `<p class="hint">Debe quedar al menos una categoría de este tipo.</p>`}` : ""}`, s => {
    const ic = s.querySelector("#kIcono");
    s.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => { ic.value = b.dataset.emo; s.querySelectorAll("[data-emo]").forEach(x => x.classList.toggle("on", x === b)); });
    s.querySelector("#ok").onclick = () => {
      const nombre = s.querySelector("#kNombre").value.trim(), em = ic.value.trim() || "🏷️";
      if (!nombre) return toast("Escribe un nombre");
      if (data.config.categorias.some(x => x.tipo === tipo && x.id !== id && norm(x.nombre) === norm(nombre))) return toast("Ya tienes una categoría con ese nombre");
      let obj;
      if (c) { c.nombre = nombre; c.icono = em; obj = c; }
      else { obj = { id: uid(), nombre, icono: em, tipo };
        const otros = data.config.categorias.findIndex(x => x.tipo === tipo && /^otros/i.test(x.nombre));
        data.config.categorias.splice(otros >= 0 ? otros : data.config.categorias.length, 0, obj); }
      guardarConfig(); render(); toast(c ? "Categoría actualizada" : "Categoría creada");
      alTerminar ? alTerminar(obj) : cerrar();
    };
    const del = s.querySelector("#del");
    if (del) del.onclick = () => {
      const destino = s.querySelector("#kMover")?.value;
      if (!confirm(`¿Eliminar "${c.nombre}"?${destino ? " Sus registros pasarán a la categoría elegida." : ""}`)) return;
      if (destino) {
        Object.keys(data.meses).forEach(ym => { let cambio = false;
          data.meses[ym].movs.forEach(m => { if (m.categoriaId === c.id) { m.categoriaId = destino; cambio = true; } });
          if (cambio) guardarMes(ym); });
        data.config.recurrentes.forEach(r => { if (r.categoriaId === c.id) r.categoriaId = destino; });
        data.config.favoritos.forEach(f => { if (f.categoriaId === c.id) f.categoriaId = destino; });
      }
      data.config.categorias = data.config.categorias.filter(x => x.id !== c.id);
      guardarConfig(); render(); toast("Categoría eliminada");
      alTerminar ? alTerminar(null) : cerrar();
    };
  });
}

/* ============ Respaldo ============ */
async function exportar() {
  const txt = JSON.stringify({ app: "libreta", version: 1, exportado: new Date().toISOString(), ...data }, null, 2);
  const nombre = `libreta-respaldo-${hoy()}.json`;
  const dl = HAY_CLAUDE ? await window.claude.use("downloads") : null;
  if (CAP && CAP.Plugins.Filesystem && CAP.Plugins.Share) {
    try {
      const f = await CAP.Plugins.Filesystem.writeFile({ path: nombre, data: txt, directory: "CACHE", encoding: "utf8" });
      await CAP.Plugins.Share.share({ title: "Respaldo Libreta", dialogTitle: "Guardar o enviar el respaldo", files: [f.uri] });
      toast("Respaldo listo");
    } catch (e) { if (!/cancel/i.test(e?.message || "")) { toast("No se pudo crear el respaldo"); return; } }
  } else if (dl) {
    try { await dl.save({ filename: nombre, data: txt }); toast("Respaldo descargado"); }
    catch (e) { if (e?.code !== "declined") toast("No se pudo descargar aquí"); return; }
  } else {
    const blob = new Blob([txt], { type: "application/json" }), file = new File([blob], nombre, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [file], title: "Respaldo Libreta" }); } catch (e) { if (e?.name === "AbortError") return; }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
    toast("Respaldo listo");
  }
  try { localStorage.setItem(LS + "-respaldo", String(Date.now())); } catch (e) {}
}
function importar(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const p = JSON.parse(fr.result);
      if (!p.config || !p.meses) throw 0;
      if (!confirm("Esto reemplaza todos tus datos actuales por los del respaldo. ¿Continuar?")) return;
      const viejos = Object.keys(data.meses);
      data = { config: p.config, meses: p.meses };
      guardarConfig();
      viejos.filter(ym => !data.meses[ym]).forEach(ym => col && col.doc("m-" + ym).delete().catch(() => {}));
      Object.keys(data.meses).forEach(guardarMes);
      toast("Respaldo restaurado"); render();
    } catch (e) { toast("Ese archivo no es un respaldo válido de Libreta"); }
  };
  fr.readAsText(file);
}
function borrarTodo() {
  if (!confirm("Se borrarán todos tus movimientos, fijos, deudas y metas. ¿Seguro?")) return;
  const viejos = Object.keys(data.meses);
  data = { config: configInicial(), meses: {} };
  viejos.forEach(ym => col && col.doc("m-" + ym).delete().catch(() => {}));
  guardarConfig(); toast("Datos borrados"); render();
}

/* ============ App instalable (sin Claude) ============ */
let instalarEvt = null;
const enModoApp = () => !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
if (!HAY_CLAUDE && !CAP && /^https?:$/.test(location.protocol)) {
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  try { navigator.storage?.persist?.(); } catch (e) {}
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); instalarEvt = e; if (ui.tab === "mas") render(); });
}
async function instalar() { if (!instalarEvt) return; instalarEvt.prompt(); await instalarEvt.userChoice.catch(() => {}); instalarEvt = null; render(); }

if (CAP && CAP.Plugins.App) CAP.Plugins.App.addListener("backButton", () => {
  if ($("#scrim").classList.contains("open")) cerrar();
  else if (ui.tab !== "inicio") { ui.tab = "inicio"; render(); window.scrollTo(0, 0); }
  else CAP.Plugins.App.exitApp();
});

/* ============ Eventos ============ */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { ui.tab = d.tab; if (d.tab === "metas" && e.target.closest(".sec")) ui.metasTab = "bolsillos"; cerrar(); render(); window.scrollTo(0, 0); }
  else if (d.filtro) { ui.filtro = d.filtro; render(); }
  else if (d.mov) { const m = movsMes(d.ym).find(x => x.id === d.mov); if (m) (m.tipo === "prestamo" || m.tipo === "ajuste") ? hojaMovSimple(m) : hojaMovimiento(m); }
  else if (d.verpersona) hojaVerPersona(d.verpersona);
  else if (d.tcolor) { aplicarTema({ color: d.tcolor }); render(); }
  else if (d.tmodo) { aplicarTema({ modo: d.tmodo }); render(); }
  else if (d.prestamo) { const [pid, dir] = d.prestamo.split("|"); hojaPrestamo(pid, dir); }
  else if (d.pagar) { const [t, id] = d.pagar.split(":"); hojaPago(t, id); }
  else if (d.aportar) hojaAporte(d.aportar);
  else if (d.salario) hojaSalario(d.salario);
  else if (d.comprar) hojaMovimiento(null, { fuente: "t:" + d.comprar });
  else if (d.edittarjeta) hojaTarjeta(d.edittarjeta);
  else if (d.editbolsillo) hojaBolsillo(d.editbolsillo);
  else if (d.metas) { ui.metasTab = d.metas; render(); }
  else if (d.vertarjeta) hojaVerTarjeta(d.vertarjeta);
  else if (d.vercredito) hojaVerCredito(d.vercredito);
  else if (d.verbolsillo) hojaVerBolsillo(d.verbolsillo);
  else if (d.vermeta) hojaVerMeta(d.vermeta);
  else if (d.gastobolsillo) { const b = data.config.bolsillos.find(x => x.id === d.gastobolsillo); b && hojaMovimiento(null, { catSel: b.categoriaId }); }
  else if (d.editfijo) hojaFijo(d.editfijo);
  else if (d.editdeuda) hojaDeuda(d.editdeuda);
  else if (d.editmeta) hojaMeta(d.editmeta);
  else if (d.editcuenta) hojaCuenta(d.editcuenta);
  else if (d.accion) ({
    nuevo: () => hojaMovimiento(), nuevoFijo: () => hojaFijo(), nuevaDeuda: () => hojaDeuda(), nuevaMeta: () => hojaMeta(),
    nuevaCuenta: () => hojaCuenta(), perfil: hojaPerfil, nuevaTarjeta: () => hojaTarjeta(), nuevoBolsillo: () => hojaBolsillo(), nuevaPersona: () => hojaPrestamo(null, "di"), favoritos: hojaFavoritos, instalar, claude: pedirClaude, gemini: hojaGemini, categorias: () => hojaCategorias(), desglose: hojaDesglose, proximos: hojaProximos, consejos: hojaConsejos,
    fijosAdmin: hojaFijosAdmin, prestaciones: hojaPrestaciones, legal: hojaLegal, exportar, importar: () => $("#archivo").click(), borrarTodo,
  })[d.accion]?.();
});
document.addEventListener("change", e => { if (e.target.id === "archivo" && e.target.files[0]) { importar(e.target.files[0]); e.target.value = ""; } });
$("#fab").onclick = () => hojaMovimiento();
$("#cfg").onclick = () => { ui.tab = "mas"; render(); window.scrollTo(0, 0); };
$("#prev").onclick = () => { ui.mes = ymShift(ui.mes, -1); render(); };
$("#next").onclick = () => { ui.mes = ymShift(ui.mes, 1); render(); };
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") cerrar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

render();
</script>
